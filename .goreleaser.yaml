version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    files:
      - README.md
      - CHANGELOG.md
      - COPYING
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
